# Ruff config for vision-relay
# Lint focuses on real problems (pyflakes F = unused imports/vars/dead code);
# E501 is ignored because some protocol field names / URLs are intentionally long.

target-version = "py310"
line-length = 120
src = ["vision_relay"]

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["vision_relay"]

# ruff >= 0.16 formats embedded Python code blocks in .md files; docs must stay
# verbatim (historical records), so format never touches docs/ or research/.
[format]
exclude = ["docs/**", "research/**"]
