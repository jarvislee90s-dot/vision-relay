# 发布流水线（spec 2026-08-26 §4）：仅手动触发；三平台任一失败 = 整次失败，
# 不建 tag / 不建 Release，重跑零成本。成功 → Draft Release（人工验收后 Publish）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z，不带 v）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Semver check
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须形如 X.Y.Z（如 1.0.0），收到: ${{ inputs.version }}"
            exit 1
          fi

  build:
    name: build (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win,    arch: x64 }
          - { os: macos-latest,   platform: macos,  arch: arm64 }
          - { os: ubuntu-latest,  platform: linux,  arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Version inject
        shell: bash
        run: python3 scripts/set_version.py "${{ inputs.version }}"

      # ---------- 冻结核心（三平台统一 uv 路径；macOS=aarch64，spec §5 退路一） ----------
      - name: Freeze core (uv)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Freeze core (PyInstaller onedir)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run --no-project --python 3.12 --with pyinstaller --with httpx \
            pyinstaller --noconfirm --clean --name vision-relay --paths . \
            --exclude-module pkg_resources --exclude-module setuptools \
            --distpath freeze-dist --workpath freeze-build scripts/freeze_entry.py
          BIN=freeze-dist/vision-relay/vision-relay
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          test -f "$BIN"

      - name: Smoke frozen core (version + import chain)
        shell: bash
        run: |
          BIN=freeze-dist/vision-relay/vision-relay
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi  # 命令替换式后缀在非 Windows 会以码1终结（set -e 杀脚本）
          OUT=$("$BIN" --version)
          echo "frozen --version: $OUT"
          [[ "$OUT" == *"${{ inputs.version }}"* ]] || { echo "::error::冻结核心版本号不符"; exit 1; }
          "$BIN" --help > /dev/null

      - name: Place frozen core into Tauri resources
        shell: bash
        run: |
          mkdir -p gui/src-tauri/resources/core
          cp -r freeze-dist/vision-relay/. gui/src-tauri/resources/core/
          ls gui/src-tauri/resources/core | head -5

      # ---------- 前端依赖 ----------
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gui

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev patchelf xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # ---------- Tauri 打包 ----------
      - name: Build (Windows NSIS)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
        working-directory: gui

      - name: Build (macOS DMG)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles dmg
        working-directory: gui

      - name: Build (Linux AppImage + deb)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb
        working-directory: gui

      # ---------- 收集改名上传 ----------
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          mkdir -p release-assets
          case "$RUNNER_OS" in
            Windows)
              exe=$(find gui/src-tauri/target/release/bundle/nsis -name "*-setup.exe" -print -quit)
              [ -n "$exe" ] || { echo "::error::NSIS setup.exe not found"; exit 1; }
              cp "$exe" "release-assets/vision-relay-$V-win-x64-setup.exe" ;;
            macOS)
              dmg=$(find gui/src-tauri/target -name "*.dmg" -print -quit)
              [ -n "$dmg" ] || { echo "::error::DMG not found"; exit 1; }
              cp "$dmg" "release-assets/vision-relay-$V-macos-arm64.dmg" ;;
            Linux)
              appimage=$(find gui/src-tauri/target/release/bundle/appimage -name "*.AppImage" -print -quit)
              deb=$(find gui/src-tauri/target/release/bundle/deb -name "*.deb" -print -quit)
              [ -n "$appimage" ] && [ -n "$deb" ] || { echo "::error::AppImage/deb not found"; exit 1; }
              cp "$appimage" "release-assets/vision-relay-$V-linux-x64.AppImage"
              cp "$deb" "release-assets/vision-relay-$V-linux-x64.deb" ;;
          esac
          ls -la release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build release body (curated notes first, CHANGELOG fallback)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # 先按 CHANGELOG 拼兜底正文；若存在人工文案 docs/release-notes/v<版本>.md
          # （自带标题与排版）则整体覆盖——工作流重跑因此不会把已发布的图文公告
          # 覆盖回技术 changelog（2026-08-27 事故：重跑盖掉了 v1.0.0 定制正文）。
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(v)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          body = m.group(1).strip() if m else f"vision-relay v{v}"
          open("body.md", "w", encoding="utf-8").write(f"vision-relay v{v}\n\n{body}\n")
          PY
          if [ -s "docs/release-notes/v${VERSION}.md" ]; then
            cp "docs/release-notes/v${VERSION}.md" body.md
          fi
          cat body.md

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: vision-relay v${{ inputs.version }}
          body_path: body.md
          draft: true
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
