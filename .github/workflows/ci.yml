name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run offline tests
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run --no-project
          --python ${{ matrix.python-version }}
          --with pytest
          --with httpx
          python -m pytest -q

      - name: Lint
        run: |
          uv run --no-project --python ${{ matrix.python-version }} --with ruff ruff check .
          uv run --no-project --python ${{ matrix.python-version }} --with ruff ruff format --check .

  packaging:
    name: build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and smoke-test it
        run: |
          uv build
          uv venv .smoke
          uv pip install --python .smoke dist/*.whl
          .smoke/bin/python -m vision_relay --version
          .smoke/bin/vision-relay --version
