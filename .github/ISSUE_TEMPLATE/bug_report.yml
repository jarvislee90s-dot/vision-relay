name: Bug report
description: Report a reproducible problem in vision-relay
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve vision-relay. For security vulnerabilities, follow the [security policy](SECURITY.md) instead of opening a public issue.

  - type: input
    id: harness
    attributes:
      label: Agent harness / client
      description: For example, Claude Code, Codex, Qwen Code, zcode, Gemini CLI, or a raw HTTP client.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Before pasting logs or diagnostic reports**: `vision-relay diagnose --json` output may contain
        provider base URLs and model names. Scrub API keys, tokens, and anything you consider private
        before posting.

  - type: input
    id: upstream
    attributes:
      label: Upstream / VLM backend
      description: Which VLM (e.g. Ollama, a local model, a DashScope-compatible endpoint) and which protocol (Anthropic / Responses / Chat).
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest input and sequence that consistently triggers the problem.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release, commit SHA, or install date

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, architecture, Python version, and relevant system tools.

  - type: textarea
    id: logs
    attributes:
      label: Additional context and logs
      description: Include relevant logs or proxy output. Remove API keys, credentials, private paths, and sensitive media.
      render: shell
